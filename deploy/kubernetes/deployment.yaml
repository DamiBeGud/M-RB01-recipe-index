apiVersion: apps/v1
kind: Deployment
metadata:
  name: ba-pilot-rb01-20261122
  namespace: deployflow-test
  labels: &id001
    app.kubernetes.io/name: ba-pilot-rb01-20261122
    app.kubernetes.io/managed-by: deployflow
    app.kubernetes.io/instance: bc4afd53-8ab8-4fe8-8602-08191294842e
spec:
  replicas: 1
  selector:
